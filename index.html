<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Apilator</title>
    <style>
      /* Splash screen - inline so it shows immediately */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #1a1b26;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        max-width: 80%;
        max-height: 80%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <!-- Splash screen - shows immediately -->
    <div id="splash">
      <img src="/apilator_splash.png" alt="Apilator" />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
